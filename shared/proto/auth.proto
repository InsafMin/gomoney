syntax = "proto3";

package auth;

option go_package = "github.com/InsafMin/gomoney/shared/proto";

// Сервис аутентификации и управления пользователями
service AuthService {
  // Регистрация нового пользователя
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Вход в систему
  rpc Login(LoginRequest) returns (LoginResponse);

  // Обновление access токена
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Валидация токена
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // Получение профиля пользователя
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // Обновление профиля
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Удаление пользователя
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // Проверка доступности email
  rpc CheckEmail(CheckEmailRequest) returns (CheckEmailResponse);
}

// Сообщения для регистрации
message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
  int64 created_at = 3;
  UserProfile profile = 4;
}

// Сообщения для входа
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  UserProfile profile = 4;
}

// Сообщения для обновления токена
message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

// Сообщения для валидации токена
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  int64 expires_at = 4;
}

// Сообщения для профиля
message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserProfile profile = 1;
  bool success = 2;
  string message = 3;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
  string message = 2;
  bool success = 3;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// Проверка email
message CheckEmailRequest {
  string email = 1;
}

message CheckEmailResponse {
  bool available = 1;
  string message = 2;
}

// Общие структуры
message UserProfile {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message User {
  string id = 1;
  string email = 2;
  string password_hash = 3;
  string first_name = 4;
  string last_name = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  bool is_active = 8;
  int64 last_login = 9;
}