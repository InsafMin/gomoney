services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/migrations:/docker-entrypoint-initdb.d
    networks:
      - finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: auth-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-finance_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-finance_tracker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      TOKEN_REFRESH_TTL: ${TOKEN_REFRESH_TTL:-168h}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-6}
      PASSWORD_SALT: ${PASSWORD_SALT:?Set PASSWORD_SALT in .env}
      GRPC_PORT: ${AUTH_SERVICE_PORT:-50051}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance-network
    restart: unless-stopped

  transaction-service:
    build:
      context: .
      dockerfile: ./transaction-service/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: transaction-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-finance_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-finance_tracker}
      AUTH_SERVICE_URL: auth-service:${AUTH_SERVICE_PORT:-50051}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_TRANSACTIONS: ${KAFKA_TOPIC_TRANSACTIONS:-transactions}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RUB}
      ALLOWED_CURRENCIES: ${ALLOWED_CURRENCIES:-RUB,USD,EUR}
      GRPC_PORT: ${TRANSACTION_SERVICE_PORT:-50052}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      - auth-service
      - postgres
      - kafka
    networks:
      - finance-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: ./analytics-service/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: analytics-service
      DATABASE_URL: postgres://${POSTGRES_USER:-finance_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-finance_tracker}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-finance_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-finance_tracker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_TRANSACTIONS: ${KAFKA_TOPIC_TRANSACTIONS:-transactions}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-analytics-group}
      KAFKA_GROUP: ${KAFKA_CONSUMER_GROUP:-analytics-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC_TRANSACTIONS:-transactions}
      REPORT_CACHE_TTL: ${REPORT_CACHE_TTL:-300s}
      CACHE_TTL: ${REPORT_CACHE_TTL:-300s}
      GRPC_PORT: ${ANALYTICS_SERVICE_PORT:-50053}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - finance-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: auth-service:${AUTH_SERVICE_PORT:-50051}
      TRANSACTION_SERVICE_URL: transaction-service:${TRANSACTION_SERVICE_PORT:-50052}
      ANALYTICS_SERVICE_URL: analytics-service:${ANALYTICS_SERVICE_PORT:-50053}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HTTP_PORT: ${API_GATEWAY_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      - auth-service
      - transaction-service
      - analytics-service
    networks:
      - finance-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api-gateway
    networks:
      - finance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - finance-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

networks:
  finance-network:
    driver: bridge